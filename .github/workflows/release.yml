# Pushing a tag vX.Y.Z builds the binaries and publishes them as a release:
# one archive per platform with its checksum, and the scoop manifest.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built against musl: a binary with no libc to match, to copy next to a dump
          - {target: x86_64-unknown-linux-musl, os: ubuntu-latest}
          - {target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm}
          - {target: aarch64-apple-darwin, os: macos-latest}
          - {target: x86_64-apple-darwin, os: macos-13}
          - {target: x86_64-pc-windows-msvc, os: windows-latest}
          - {target: aarch64-pc-windows-msvc, os: windows-11-arm}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="jheap-cli"))')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} is not version $version"; exit 1; }
      - name: Tools for musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p jheap-cli --target ${{ matrix.target }}
      - name: Test what was built
        run: cargo test --release --locked -p jheap-cli --target ${{ matrix.target }}
      - name: Archive
        id: archive
        run: |
          name=jheap-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp README.md "$name/"
          cp LICENSE* "$name/" 2>/dev/null || true
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/jheap.exe "$name/"
            7z a "$name.zip" "$name" >/dev/null
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp target/${{ matrix.target }}/release/jheap "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - name: Checksum
        run: |
          f=${{ steps.archive.outputs.file }}
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          cat "$f.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.archive.outputs.file }}
            ${{ steps.archive.outputs.file }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The scoop manifest
        run: |
          version=${GITHUB_REF_NAME#v}
          python3 packaging/scoop.py "$version" dist > dist/jheap.json
          cat dist/jheap.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "jheap $GITHUB_REF_NAME" --generate-notes
